title = "maxwell-automations leak rules"

[extend]
useDefault = true

[[rules]]
id = "windows-user-path"
description = "Windows user profile path"
regex = '''(?i)C:[/\\]Users[/\\][^\s"'`]+'''
[[rules.allowlists]]
regexes = ['''C:[/\\]Users[/\\]dev[/\\]''']

[[rules]]
id = "unix-user-path"
description = "Unix home path with a real username"
regex = '''(?i)/Users/[A-Za-z0-9._-]+/'''
[[rules.allowlists]]
regexes = ['''/Users/dev/''']

[[rules]]
id = "tailscale-cgnat-ip"
description = "Real Tailscale address (100.64.0.0/10); docs and tests must use placeholder ranges"
regex = '''\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
[[rules.allowlists]]
# The rule has a capture group, so the default "secret" target would be just
# the second octet; match against the whole address instead.
regexTarget = "match"
regexes = ['''\b100\.64\.[01]\.[0-9]{1,3}\b''', '''\b100\.127\.255\.1\b''']

[[rules]]
id = "transcript-uuid-link"
description = "Markdown link to a Cursor transcript UUID"
regex = '''\[[^\]]+\]\([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\)'''
