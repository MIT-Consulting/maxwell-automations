name: Gitleaks

on:
  push:
    branches: ["**"]
  # Manual runs scan the full history (push events only scan the pushed range).
  workflow_dispatch:

jobs:
  gitleaks:
    name: secret + personal-info scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action only auto-discovers `.gitleaks.toml`; ours is un-dotted.
          GITLEAKS_CONFIG: gitleaks.toml
